spring.application.name=budgetapi

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/budgetapi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:budget}
spring.datasource.password=${DB_PASSWORD:budget}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=864000000
jwt.header=Authorization
jwt.token-prefix=Bearer


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.mail.from-name=${MAIL_FROM_NAME:Budget App}

logging.level.root=INFO
logging.level.mk.mdt.budgetapi=${LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/budgetapi.log

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.frontend-url=${FRONTEND_URL:http://localhost:8443}